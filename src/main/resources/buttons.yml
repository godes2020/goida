# Конфигурация кнопок для всех меню
# Кнопки могут быть текстовыми (text) или предметными (item):
#
# Пример предметной кнопки:
#   my_button:
#     sx: 0.0
#     sy: 0.0
#     half-width: 0.40
#     half-height: 0.40
#     scale: 1.0
#     item:
#       ia-id: "orjusmenu:some_item"
#       material: ""
#       custom-model-data: 0
#     item-hover:
#       ia-id: "orjusmenu:some_item_hover"
#       material: ""
#       custom-model-data: 0
#     actions: []
#
